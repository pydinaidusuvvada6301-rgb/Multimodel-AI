services:
  - type: web
    name: omnimind-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_BASE_URL
        value: /api/v1
      - key: STORAGE_BUCKET
        value: omnimind-private
      - key: MAX_FILE_SIZE_MB
        value: 25
      - key: MAX_FILES_PER_UPLOAD
        value: 10
      - key: MAX_RETRIEVAL_CHUNKS
        value: 12
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: LOG_LEVEL
        value: info
